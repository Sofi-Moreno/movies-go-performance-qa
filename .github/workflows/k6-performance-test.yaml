
name: K6 Performance Tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Selecciona la prioridad a evaluar (Según PDF de QA)'
        required: true
        type: choice
        options:
          - 1-rent-stock
          - 2-persistence
          - 3-search-local
          - 4-external-api

jobs:
  load-test:
    name: Load Test (${{ github.event.inputs.scenario }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v7
        with:
          path: qa

      - name: Checkout original Movies Go
        uses: actions/checkout@v7
        with:
          repository: AsaelCRdev/Proyecto-equipo-64-1
          ref: main
          path: movies-go
          persist-credentials: false

      - name: Verify project and k6 files
        shell: bash
        run: |
          set -e

          test -f movies-go/Back/pom.xml
          test -f qa/performance/k6/config/standar-configuration.js
          test -f "qa/performance/k6/scenarios/${{ github.event.inputs.scenario }}.js"

          echo "Movies Go and k6 files verified."

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: movies-go/Back/pom.xml

      - name: Start Spring Boot Application
        env:
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: |
          nohup mvn -B -f movies-go/Back/pom.xml spring-boot:run \
            > "$RUNNER_TEMP/backend.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/backend.pid"

      - name: Wait for backend to be ready
        shell: bash
        run: |
          for i in {1..45}; do
            if curl --silent --max-time 2 \
              --output /dev/null http://127.0.0.1:8080/; then
              echo "Backend is responding."
              exit 0
            fi

            sleep 2
          done

          echo "Backend did not become available."
          tail -n 100 "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 scenario
        uses: grafana/run-k6-action@v1
        with:
          path: qa/performance/k6/scenarios/${{ github.event.inputs.scenario }}.js
          debug: true

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ github.event.inputs.scenario }}
          path: reporte-*.html
          retention-days: 3
          if-no-files-found: warn

      - name: Show backend logs if workflow failed
        if: failure()
        run: |
          tail -n 100 "$RUNNER_TEMP/backend.log" || true

      - name: Stop Spring Boot
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/backend.pid")" || true
          fi

name: K6 Performance Tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Selecciona el escenario de rendimiento'
        required: true
        type: choice
        options:
          - 1-rent-stock
          - 2-persistence
          - 3-search-local
          - 4-external-api

concurrency:
  group: movies-go-k6-performance
  cancel-in-progress: false

jobs:
  load-test:
    name: Load Test (${{ inputs.scenario }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v7
        with:
          path: qa

      - name: Checkout original Movies Go
        uses: actions/checkout@v7
        with:
          repository: AsaelCRdev/Proyecto-equipo-64-1
          ref: main
          path: movies-go
          persist-credentials: false

      - name: Verify project and test files
        shell: bash
        run: |
          set -e

          test -f movies-go/Back/pom.xml
          test -f movies-go/Back/src/main/java/com/backend/moviesgo/json/buyers.json
          test -f movies-go/Back/src/main/java/com/backend/moviesgo/json/movies.json

          test -f qa/performance/k6/config/standar-configuration.js
          test -f qa/performance/k6/prepare-data.py
          test -f "qa/performance/k6/scenarios/${{ inputs.scenario }}.js"

      - name: Verify OMDb secret
        env:
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        shell: bash
        run: |
          if [ -z "$OMDB_KEY" ]; then
            echo "The OMDB_KEY secret is required by the backend."
            exit 1
          fi

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: movies-go/Back/pom.xml

      - name: Prepare isolated test data
        run: |
          python3 qa/performance/k6/prepare-data.py

      - name: Start Spring Boot application
        working-directory: movies-go/Back
        env:
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        shell: bash
        run: |
          nohup mvn -B spring-boot:run \
            > "$RUNNER_TEMP/backend.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/backend.pid"

      - name: Wait for backend
        shell: bash
        run: |
          for i in {1..45}; do
            if curl --fail --silent \
              http://127.0.0.1:8080/getGenres \
              --output /dev/null; then

              echo "Backend is ready."
              exit 0
            fi

            sleep 2
          done

          echo "Backend did not become available."
          tail -n 100 "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run selected k6 scenario
        uses: grafana/run-k6-action@v1
        with:
          path: qa/performance/k6/scenarios/${{ inputs.scenario }}.js
          debug: false

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ inputs.scenario }}
          path: reporte-*.html
          retention-days: 3
          if-no-files-found: warn

      - name: Show backend logs if workflow failed
        if: failure()
        shell: bash
        run: |
          tail -n 100 "$RUNNER_TEMP/backend.log" || true

      - name: Stop Spring Boot
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/backend.pid")" || true
          fi

name: Isolated Movies Go Unit Tests

on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    paths:
      - 'tests/**'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-unit-tests:
    name: Backend unit tests (isolated)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v7
        with:
          path: qa
          persist-credentials: false

      - name: Checkout original Movies Go
        uses: actions/checkout@v7
        with:
          repository: AsaelCRdev/Proyecto-equipo-64-1
          ref: main
          path: movies-go
          persist-credentials: false

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: movies-go/Back/pom.xml

      - name: Copy isolated tests into temporary backend checkout
        run: cp -R qa/tests/unit/java/. movies-go/Back/src/test/java/

      - name: Run isolated unit tests
        working-directory: movies-go/Back
        run: mvn -B -Dtest=AuthServiceTest,ApiServiceTest,CatalogServiceTest,JsonServiceTest test
